spec:
  inputs:
    UPLOAD_TO_GITHUB_REPO:
      type: 'boolean'
      default: false
      description: 'Lädt Code in das GitHub-Repository hoch'

stages:
  - publish

publish_github:
  stage: publish
  image: "docker-sds.repo.sds.seitenbau.net/sds-pi/git-bash:0.4.1"
  variables:
    GITHUB_REPO: "github.com/Seitenbau/Vorlage-Prozessmodellierung-Serviceportal.git"
  script:
    - git checkout $CI_COMMIT_REF_NAME
    - git config user.email "no-reply@seitenbau.com"
    - git config user.name "Seitenbau"
    - git remote add github "https://oauth2:${GITHUB_TOKEN}@${GITHUB_REPO}"
    - git fetch github
    - git push github $CI_COMMIT_REF_NAME --force
  rules:
    - if: '"$[[ inputs.UPLOAD_TO_GITHUB_REPO ]]" == "true"'
      when: on_success
